services:
  rap:
    build: .
    image: rap:latest
    # Run as your host user so files written to the repo aren't owned by root
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./:/workspace
    ports:
      - "127.0.0.1:7860:7860"
    environment:
      # app.py opens a public *.gradio.live link unless this is "permanent"; keep it local-only
      SHARE_URL: "${SHARE_URL:-permanent}"
    shm_size: "8gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
