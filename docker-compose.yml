services:
  rap:
    build: .
    image: rap:latest
    # Run as your host user so files written to the repo aren't owned by root
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./:/workspace
    ports:
      - "7860:7860"
    shm_size: "8gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
